<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#F6C82D;--brand-lt:#FFFBDD;--brand-dk:#C9A000;
  --sand:#FFFDF0;--ink:#1A1200;--muted:#7A7060;--white:#fff;
  --card-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --card-shadow-hover:0 8px 30px rgba(0,0,0,.12);
  --radius:16px;--radius-sm:10px;
  --font-en:'Outfit',sans-serif;--font-ar:'Noto Kufi Arabic',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-en);background:var(--sand);color:var(--ink);line-height:1.5;overflow-x:hidden}
[dir="rtl"] body{font-family:var(--font-ar)}

.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.05);padding:12px 0}
.header-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-area{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-icon{width:44px;height:44px;background:var(--brand);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#1A1200;font-size:20px;font-family:var(--font-ar);box-shadow:0 2px 8px rgba(246,200,45,.4)}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-text .en{font-weight:700;font-size:18px;letter-spacing:-.5px;color:var(--ink)}
.logo-text .ar{font-family:var(--font-ar);font-size:13px;color:var(--brand);font-weight:600}
.search-wrap{flex:1;min-width:180px;max-width:420px;position:relative}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid rgba(0,0,0,.08);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--sand);outline:none;transition:all .2s}
.search-wrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(246,200,45,.12)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
[dir="rtl"] .search-icon{left:auto;right:12px}
[dir="rtl"] .search-wrap input{padding:10px 38px 10px 14px}
.header-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
[dir="rtl"] .header-actions{margin-left:0;margin-right:auto}
.btn-toggle{padding:8px 14px;border:1.5px solid rgba(0,0,0,.08);border-radius:var(--radius-sm);background:var(--white);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .2s;color:var(--ink);white-space:nowrap}
.btn-toggle:hover{border-color:var(--brand);color:var(--brand)}
.btn-toggle.active{background:var(--brand);color:#1A1200;border-color:var(--brand)}

.tabs-wrap{background:var(--white);border-bottom:1px solid rgba(0,0,0,.05);position:sticky;top:68px;z-index:90}
.tabs-scroll{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab-btn{padding:10px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;transition:all .2s}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
[dir="rtl"] .tab-btn{font-family:var(--font-ar)}

.menu-section{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr);gap:20px}}

.card{background:var(--white);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--card-shadow);transition:all .3s cubic-bezier(.4,0,.2,1);opacity:0;animation:fadeUp .45s ease forwards}
.card:hover{transform:translateY(-4px);box-shadow:var(--card-shadow-hover)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:#f5f0eb}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-img img{transform:scale(1.05)}
.card-body{padding:12px 14px 14px}
.card-name{font-weight:600;font-size:14px;line-height:1.3;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card-name-sub{font-size:12px;color:var(--muted);margin-bottom:6px;font-family:var(--font-ar);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
[dir="rtl"] .card-name{font-family:var(--font-ar)}
[dir="rtl"] .card-name-sub{font-family:var(--font-en)}
.card-desc{font-size:12px;color:var(--muted);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;min-height:18px}
[dir="rtl"] .card-desc{font-family:var(--font-ar)}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.card-price{font-weight:700;font-size:16px;color:var(--brand-dk)}
.card-size{font-size:11px;color:var(--muted);background:var(--brand-lt);padding:3px 8px;border-radius:6px;font-weight:500}

.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
@media(min-width:640px){.modal-overlay.open{align-items:center}}
.modal{background:var(--white);border-radius:var(--radius) var(--radius) 0 0;max-height:92vh;width:100%;max-width:480px;overflow-y:auto;animation:slideUp .3s ease}
@media(min-width:640px){.modal{border-radius:var(--radius);max-height:85vh}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-img{aspect-ratio:16/10;overflow:hidden;position:relative;background:#f5f0eb}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:2;transition:background .2s}
.modal-close:hover{background:rgba(0,0,0,.7)}
[dir="rtl"] .modal-close{right:auto;left:12px}
.modal-body{padding:20px 24px 28px}
.modal-names{margin-bottom:4px}
.modal-name-en{font-size:22px;font-weight:700;line-height:1.3}
.modal-name-ar{font-size:16px;font-family:var(--font-ar);color:var(--muted);font-weight:500}
[dir="rtl"] .modal-name-en{font-family:var(--font-en);font-size:16px;color:var(--muted);font-weight:500}
[dir="rtl"] .modal-name-ar{font-family:var(--font-ar);font-size:22px;font-weight:700;color:var(--ink)}
.modal-price-row{display:flex;align-items:center;gap:10px;margin:12px 0 16px}
.modal-price{background:var(--brand);color:#1A1200;padding:6px 16px;border-radius:20px;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(246,200,45,.4)}
.modal-size{font-size:13px;color:var(--muted)}
.modal-desc{font-size:14px;color:#555;line-height:1.6;margin-bottom:16px}
[dir="rtl"] .modal-desc{font-family:var(--font-ar)}
.modal-section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
[dir="rtl"] .modal-section-title{font-family:var(--font-ar);letter-spacing:0}
.addons-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.addon-badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;background:var(--brand-lt);color:var(--brand-dk);border:1px solid rgba(246,200,45,.15)}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}
.items-count{text-align:center;padding:8px;font-size:12px;color:var(--muted);font-weight:500}
</style>
</head>

  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
}

function buildTabs(){
  const wrap=document.getElementById("tabsScroll");
  wrap.innerHTML="";
  const allBtn=document.createElement("button");
  allBtn.className="tab-btn"+(activeCat==="all"?" active":"");
  allBtn.textContent=lang==="en"?"All":"الكل";
  allBtn.dataset.cat="all";
  allBtn.onclick=()=>setCat("all");
  wrap.appendChild(allBtn);
  catOrder.forEach(c=>{
    const btn=document.createElement("button");
    btn.className="tab-btn"+(activeCat===c?" active":"");
    const item=menuItems.find(i=>i.catEn===c);
    btn.textContent=lang==="en"?c:(item?item.catAr:c);
    btn.dataset.cat=c;
    btn.onclick=()=>setCat(c);
    wrap.appendChild(btn);
  });
}

function setCat(c){
  activeCat=c;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.cat===c));
  renderGrid();
}

function renderGrid(){
  const grid=document.getElementById("menuGrid");
  let filtered=menuItems;
  if(activeCat!=="all")filtered=filtered.filter(i=>i.catEn===activeCat);
  if(searchTerm){
    filtered=filtered.filter(i=>
      i.nameEn.toLowerCase().includes(searchTerm)||
      i.nameAr.includes(searchTerm)||
      i.descEn.toLowerCase().includes(searchTerm)||
      i.descAr.includes(searchTerm)||
      i.catEn.toLowerCase().includes(searchTerm)||
      i.catAr.includes(searchTerm)
    );
  }
  if(filtered.length===0){
    grid.innerHTML='<div class="empty-state"><div class="icon">\u{1F50D}</div><p>'+(lang==="en"?"No items found":"لا توجد نتائج")+'</p></div>';
  } else {
    grid.innerHTML=filtered.map((item,idx)=>{
      const imgSrc=IMG[String(item.id)]||"";
      const name1=lang==="en"?item.nameEn:item.nameAr;
      const name2=lang==="en"?item.nameAr:item.nameEn;
      const desc=lang==="en"?item.descEn:item.descAr;
      const size=lang==="en"?item.sizeEn:item.sizeAr;
      return '<div class="card" style="animation-delay:'+idx*30+'ms" onclick="openModal('+item.id+')">'+
        '<div class="card-img">'+
          (imgSrc?'<img src="'+imgSrc+'" alt="'+item.nameEn+'" loading="lazy">':'')+
        '</div>'+
        '<div class="card-body">'+
          '<div class="card-name">'+name1+'</div>'+
          '<div class="card-name-sub">'+name2+'</div>'+
          '<div class="card-desc">'+desc+'</div>'+
          '<div class="card-footer">'+
            '<span class="card-price">'+item.price+' '+(lang==="en"?"SAR":"ر.س")+'</span>'+
            '<span class="card-size">'+size+'</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join("");
  }
  document.getElementById("itemsCount").textContent=filtered.length+" "+(lang==="en"?"items":"صنف");
}

function openModal(id){
  const item=menuItems.find(i=>i.id===id);
  if(!item)return;
  const imgSrc=IMG[String(item.id)]||"";
  document.getElementById("modalImage").src=imgSrc;
  document.getElementById("modalImage").alt=item.nameEn;
  document.getElementById("modalNameEn").textContent=item.nameEn;
  document.getElementById("modalNameAr").textContent=item.nameAr;
  document.getElementById("modalPrice").textContent=item.price+" "+(lang==="en"?"SAR":"ر.س");
  document.getElementById("modalSize").textContent=lang==="en"?item.sizeEn:item.sizeAr;
  document.getElementById("modalDesc").textContent=lang==="en"?item.descEn:item.descAr;
  const addons=lang==="en"?item.addEn:item.addAr;
  const aw=document.getElementById("addonsWrap");
  const at=document.getElementById("addonsTitle");
  if(addons&&addons.trim()){
    at.style.display="flex";
    aw.innerHTML=addons.split(/[,،]/).filter(a=>a.trim()).map(a=>'<span class="addon-badge">'+a.trim()+'</span>').join("");
  } else {
    at.style.display="none";
    aw.innerHTML="";
  }
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow="hidden";
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow="";
}
function closeModalBg(e){if(e.target===e.currentTarget)closeModal()}

function toggleLang(){
  lang=lang==="en"?"ar":"en";
  const html=document.documentElement;
  if(lang==="ar"){html.dir="rtl";html.lang="ar"}else{html.dir="ltr";html.lang="en"}
  document.getElementById("langLabel").textContent=lang==="en"?"عربي":"EN";
  document.getElementById("searchInput").placeholder=lang==="en"?"Search menu...":"ابحث في القائمة...";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.dataset.i18n;
    const tr={addons:["Add-ons","الإضافات"]};
    if(tr[k])el.textContent=tr[k][lang==="en"?0:1];
  });
  buildTabs();
  renderGrid();
}

init();
</script>
</body>
</html>
